<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eidmaps Live</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{--hud:rgba(14,16,22,.88);--ink:#f4f6f8;--muted:#a9b3bf;--line:rgba(255,255,255,.14);--accent:#ff3ea5;--bad:#e5533d;
 --f:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;--m:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:#07070d;color:var(--ink);font-family:var(--f);overflow:hidden}
#map{position:fixed;inset:0}
.hud{position:fixed;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.street{position:absolute;top:calc(12px + env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));background:var(--hud);border-radius:16px;padding:10px 14px;border:1px solid var(--line)}
.street b{display:block;font-size:20px;line-height:1.25}
.street span{font-size:12px;color:var(--muted)}
.speeds{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom));inset-inline-start:max(12px,env(safe-area-inset-left));display:flex;gap:8px;align-items:center}
.spd{width:66px;height:66px;border-radius:50%;background:var(--hud);border:2px solid var(--line);display:grid;place-items:center;text-align:center}
.spd b{font-family:var(--m);font-size:24px;line-height:1}
.spd small{display:block;font-size:10px;color:var(--muted)}
.spd.over{border-color:var(--bad)}
.lim{width:48px;height:48px;border-radius:50%;background:#fff;border:6px solid var(--bad);color:#111;display:grid;place-items:center;font-family:var(--m);font-weight:600;font-size:16px}
.lim.unk{opacity:.45}
.limnote{font-size:10.5px;color:var(--muted);background:var(--hud);border-radius:8px;padding:3px 7px;max-width:120px}
.bar{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));background:var(--hud);border-radius:16px;padding:8px 10px;display:flex;gap:8px;align-items:center;border:1px solid var(--line)}
.bar .st{flex:1;font-size:12px;color:var(--muted);min-width:0}
.bar button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:11px;height:40px;padding:0 12px;font:inherit;font-size:13px;font-weight:600}
.sheet{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));background:rgba(14,16,22,.96);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 30%;background:rgba(255,255,255,.06);border:0;color:var(--muted);border-radius:9px;height:36px;font:inherit;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);color:#14060f;font-weight:700}
.lab{font-size:11.5px;color:var(--muted)}
.start{position:fixed;inset:0;display:grid;place-items:center;background:#07070d;padding:24px;text-align:center;z-index:5}
.start h1{font-size:28px;margin:0 0 8px}
.start p{color:var(--muted);max-width:340px;margin:0 auto 18px;line-height:1.6}
.start button{background:var(--accent);color:#14060f;border:0;border-radius:14px;height:52px;padding:0 28px;font:inherit;font-size:17px;font-weight:700}
.start small{display:block;margin-top:16px;color:var(--muted);font-size:12px}
.maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="hud">
  <div class="street"><b id="road">—</b><span id="sub"></span></div>
  <div class="speeds"><div class="spd" id="spdBox"><div><b id="spd">0</b><small>km/h GPS</small></div></div><div class="lim unk" id="lim">—</div><div class="limnote" id="limNote"></div></div>
  <div class="sheet" id="sheet" hidden>
    <div class="lab" id="lStyle"></div><div class="seg" id="segStyle"></div>
    <div class="lab" id="lView"></div><div class="seg" id="segView"></div>
  </div>
  <div class="bar"><div class="st" id="status"></div><button id="bSet"></button><button id="bLang">EN</button></div>
</div>
<div class="start" id="start"><div><h1>Eidmaps</h1><p id="startTxt"></p><button id="go"></button><small id="safe"></small></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
function showErr(m){let b=document.getElementById("errbox");if(!b){b=document.createElement("div");b.id="errbox";b.style.cssText="position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:99;background:#fff;color:#a00;font:14px system-ui;padding:10px 12px;border-radius:10px;direction:ltr";document.body.appendChild(b)}b.textContent="Eidmaps error: "+m}
window.addEventListener("error",e=>showErr(e.message||"unknown"));
window.addEventListener("unhandledrejection",e=>showErr(String(e.reason)));
document.addEventListener("DOMContentLoaded",()=>{const g=document.getElementById("go");if(g&&!g.onclick)g.addEventListener("click",()=>{document.getElementById("start").hidden=true})});
(function(){
const T={ar:{start:"يعرض شارعك الحقيقي وسرعتك من الـ GPS. بيطلب منك إذن الموقع.",go:"ابدأ",safe:"لا تستخدم الجوال وأنت تسوق. خل الجوال مثبّت أو خل الراكب يجرّب.",
  set:"الإعدادات",style:"الأسلوب",view:"العرض",views:["مائل 3D","من فوق"],wait:"ننتظر إشارة الـ GPS…",acc:"دقة الموقع",m:"م",
  limOsm:"حد السرعة من OpenStreetMap · غير مؤكد",limNone:"حد السرعة غير متوفر لهذا الشارع",noGeo:"ما قدرنا نوصل لموقعك. فعّل خدمات الموقع للمتصفح من الإعدادات.",unnamed:"شارع بدون اسم",
  styles:{real:"خريطة",sat:"قمر صناعي",neon:"نيون",gold:"ليل ذهبي",redline:"خط أحمر",blue:"مخطط هندسي",holo:"هولوجرام"}},
 en:{start:"Shows your real street and your GPS speed. It will ask for location permission.",go:"Start",safe:"Don't use the phone while driving. Mount it, or let a passenger test.",
  set:"Settings",style:"Style",view:"View",views:["3D tilt","Top down"],wait:"Waiting for GPS signal…",acc:"Accuracy",m:"m",
  limOsm:"Speed limit from OpenStreetMap · unverified",limNone:"No speed limit data for this road",noGeo:"Couldn't get your location. Allow location for this browser in Settings.",unnamed:"Unnamed road",
  styles:{real:"Map",sat:"Satellite",neon:"Neon",gold:"Gold night",redline:"Red line",blue:"Blueprint",holo:"Hologram"}}};
let lang="ar";try{lang=localStorage.getItem("eid-lang")||"ar"}catch(e){}
let styleId="real";try{styleId=localStorage.getItem("eid-style")||"real"}catch(e){}
let viewMode=0;
const ST={
 real:null,
 sat:null,
 holo:{bg:"#0c1a2a",land:"#10223a",water:"#071422",green:"#12283a",road:"#8fdcff",road2:"#4f8fb8",text:"#cfefff",halo:"#0c1a2a",bld:"#2a5a8a",bo:.55,acc:"#8fdcff"},
 neon:{bg:"#07070d",land:"#0b0b14",water:"#05051a",green:"#0d0d18",road:"#ff3ea5",road2:"#7a1f55",text:"#ffd1ec",halo:"#07070d",bld:"#1a1030",bo:.85,acc:"#ff3ea5"},
 gold:{bg:"#0a0908",land:"#100e0b",water:"#06080c",green:"#12100c",road:"#e2b25e",road2:"#6a5228",text:"#f3e0b5",halo:"#0a0908",bld:"#1c1810",bo:.85,acc:"#e2b25e"},
 redline:{bg:"#0c0d10",land:"#121318",water:"#080a10",green:"#141519",road:"#ff3b3b",road2:"#6a1a1a",text:"#ffd0d0",halo:"#0c0d10",bld:"#1c1d22",bo:.85,acc:"#ff3b3b"},
 blue:{bg:"#0e2a4a",land:"#11325a",water:"#0a2140",green:"#123760",road:"#e8f3ff",road2:"#7fa6cf",text:"#e8f3ff",halo:"#0e2a4a",bld:"#2a5585",bo:.55,acc:"#e8f3ff"}};
if(!(styleId in ST))styleId="real";
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];

let baseUrl=(styleId==="real"||styleId==="sat"?"liberty":"positron");let satOn=false;
if(!window.maplibregl){document.getElementById("startTxt").textContent="The map library did not load. Check your internet and reload.";return}
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/"+baseUrl,center:[54.37,24.47],zoom:11,pitch:0,attributionControl:{compact:true}});
function wantUrl(){return styleId==="real"||styleId==="sat"?"liberty":"positron"}
function setBase(){const w=wantUrl();const needSat=styleId==="sat";if(w!==baseUrl||needSat!==satOn){baseUrl=w;satOn=false;map.setStyle("https://tiles.openfreemap.org/styles/"+w)}else theme()}
map.on("style.load",theme);
function addSat(){if(map.getLayer("eid-sat"))return;
 map.addSource("eid-sat",{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:19,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"});
 const first=(map.getStyle().layers||[]).find(l=>l.type!=="background");map.addLayer({id:"eid-sat",type:"raster",source:"eid-sat"},first&&first.id);
 (map.getStyle().layers||[]).forEach(l=>{try{if(l.type==="fill")map.setPaintProperty(l.id,"fill-opacity",0);if(l.type==="line"&&(l["source-layer"]==="transportation"))map.setPaintProperty(l.id,"line-opacity",0.55);if(l.type==="symbol"){map.setPaintProperty(l.id,"text-color","#ffffff");map.setPaintProperty(l.id,"text-halo-color","#000000");map.setPaintProperty(l.id,"text-halo-width",1.5)}}catch(e){}});
 satOn=true}
function theme(){const S=ST[styleId];if(styleId==="sat")addSat();const layers=map.getStyle().layers||[];
 const nameExpr=lang==="ar"?["coalesce",["get","name:ar"],["get","name"]]:["coalesce",["get","name:en"],["get","name:latin"],["get","name"]];
 layers.forEach(l=>{try{
  if(l.type==="symbol"&&map.getLayoutProperty(l.id,"text-field")!==undefined)map.setLayoutProperty(l.id,"text-field",nameExpr);
  if(!S)return;
  const sl=l["source-layer"]||"";
  if(l.type==="background")map.setPaintProperty(l.id,"background-color",S.bg);
  else if(l.type==="fill"){map.setPaintProperty(l.id,"fill-color",sl==="water"?S.water:(sl==="park"||sl==="landcover"?S.green:S.land));map.setPaintProperty(l.id,"fill-outline-color",S.land)}
  else if(l.type==="line"){if(sl==="transportation"){const major=/motorway|trunk|primary/.test(l.id);map.setPaintProperty(l.id,"line-color",major?S.road:S.road2)}else map.setPaintProperty(l.id,"line-color",sl==="waterway"?S.water:S.road2)}
  else if(l.type==="symbol"){map.setPaintProperty(l.id,"text-color",S.text);map.setPaintProperty(l.id,"text-halo-color",S.halo)}
 }catch(e){}});
 const src=Object.keys(map.getStyle().sources).find(k=>map.getStyle().sources[k].type==="vector");
 if(styleId==="sat"){if(map.getLayer("eid-3d"))map.removeLayer("eid-3d")}
 else if(src&&!map.getLayer("eid-3d")){try{map.addLayer({id:"eid-3d",type:"fill-extrusion",source:src,"source-layer":"building",minzoom:14,
  paint:{"fill-extrusion-color":S?S.bld:"#d9d4cc","fill-extrusion-height":["coalesce",["get","render_height"],8],"fill-extrusion-base":["coalesce",["get","render_min_height"],0],"fill-extrusion-opacity":S?S.bo:.8}})}catch(e){}}
 else if(map.getLayer("eid-3d")){map.setPaintProperty("eid-3d","fill-extrusion-color",S?S.bld:"#d9d4cc");map.setPaintProperty("eid-3d","fill-extrusion-opacity",S?S.bo:.8)}
 document.documentElement.style.setProperty("--accent",S?S.acc:"#2d7ff9");
 if(puck)puck.style.setProperty("--c",S?S.acc:"#2d7ff9");
}

// car puck
const puck=document.createElement("div");puck.style.cssText="width:34px;height:34px;--c:#ff3ea5";
puck.innerHTML='<svg viewBox="0 0 34 34" width="34" height="34"><circle cx="17" cy="17" r="15" fill="rgba(0,0,0,.35)" stroke="var(--c)" stroke-width="2"/><path d="M17 6l8 20-8-5-8 5z" fill="var(--c)"/></svg>';
const marker=new maplibregl.Marker({element:puck,rotationAlignment:"map",pitchAlignment:"map"});

let last=null,heading=0,limFetchAt=null,limBusy=false;
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r),x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r);return (Math.atan2(y,x)/r+360)%360}
function dist(a,b){const R=6371000,r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[0]-a[0])*r,x=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
let limit=null,fix=null,disp=null,dispH=0,dispZ=17,lastF=performance.now();
function angLerp(a,b,k){let d=((b-a+540)%360)-180;return (a+d*k+360)%360}
function follow(now){const dt=Math.min(0.1,(now-lastF)/1000);lastF=now;
 if(fix){const ahead=Math.min(1.5,(now-fix.t)/1000);const r=Math.PI/180,m=fix.v*ahead;
  const tgt=[fix.c[0]+m*Math.sin(fix.h*r)/(111320*Math.cos(fix.c[1]*r)),fix.c[1]+m*Math.cos(fix.h*r)/110540];
  const k=1-Math.exp(-dt*5);disp[0]+=(tgt[0]-disp[0])*k;disp[1]+=(tgt[1]-disp[1])*k;dispH=angLerp(dispH,fix.h,1-Math.exp(-dt*4));
  const zT=viewMode===0?17.6-Math.min(1.6,fix.v*3.6/70):16;dispZ+=(zT-dispZ)*(1-Math.exp(-dt*1.5));
  marker.setLngLat(disp).setRotation(dispH);
  map.jumpTo({center:disp,bearing:viewMode===0?dispH:0,pitch:viewMode===0?62:0,zoom:dispZ,padding:{top:viewMode===0?innerHeight*0.38:0,bottom:0,left:0,right:0}})}
 requestAnimationFrame(follow)}
function onPos(p){const c=[p.coords.longitude,p.coords.latitude];const now=p.timestamp;
 let v=p.coords.speed;if((v==null||isNaN(v))&&last){const d=dist(last.c,c),dt=(now-last.t)/1000;v=dt>0?d/dt:0}
 if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&v>1.5)heading=p.coords.heading;else if(last&&dist(last.c,c)>4)heading=bearing(last.c,c);
 last={c,t:now};const kmh=Math.max(0,Math.round((v||0)*3.6));
 $("spd").textContent=kmh;$("spdBox").classList.toggle("over",limit&&kmh>limit);
 $("status").textContent=`${t("acc")} ±${Math.round(p.coords.accuracy)} ${t("m")}`;
 fix={c,t:performance.now(),v:v||0,h:heading};if(!disp){disp=c.slice();dispH=heading;marker.setLngLat(c).addTo(map);requestAnimationFrame(follow)}
 setTimeout(()=>roadName(disp||c),300);
 if(!limFetchAt||dist(limFetchAt,c)>150)fetchLimit(c);
}
function roadName(c){try{const pt=map.project(c);const fs=map.queryRenderedFeatures([[pt.x-14,pt.y-14],[pt.x+14,pt.y+14]]).filter(f=>f.sourceLayer==="transportation_name"||f.sourceLayer==="transportation");
 const f=fs.find(f=>f.properties&&(f.properties.name||f.properties["name:ar"]));
 $("road").textContent=f?(lang==="ar"?(f.properties["name:ar"]||f.properties.name):(f.properties["name:en"]||f.properties["name:latin"]||f.properties.name)):t("unnamed");
 const ref=fs.find(f=>f.properties&&f.properties.ref);$("sub").textContent=ref?ref.properties.ref:""}catch(e){}}
async function fetchLimit(c){if(limBusy)return;limBusy=true;limFetchAt=c;
 const q=`[out:json][timeout:10];way(around:25,${c[1]},${c[0]})[highway][maxspeed];out tags 1;`;
 try{const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
  const j=await r.json();const w=j.elements&&j.elements[0];const n=w?parseInt(w.tags.maxspeed,10):NaN;
  if(!isNaN(n)){limit=n;$("lim").textContent=n;$("lim").classList.remove("unk");$("limNote").textContent=t("limOsm")}else{limit=null;$("lim").textContent="—";$("lim").classList.add("unk");$("limNote").textContent=t("limNone")}
 }catch(e){}finally{limBusy=false}}

function renderUI(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("startTxt").textContent=t("start");$("go").textContent=t("go");$("safe").textContent=t("safe");$("bSet").textContent=t("set");$("bLang").textContent=lang==="ar"?"EN":"ع";
 $("lStyle").textContent=t("style");$("lView").textContent=t("view");
 $("segStyle").innerHTML=Object.keys(ST).map(k=>`<button data-s="${k}" aria-pressed="${k===styleId}">${T[lang].styles[k]}</button>`).join("");
 $("segView").innerHTML=T[lang].views.map((v,i)=>`<button data-v="${i}" aria-pressed="${i===viewMode}">${v}</button>`).join("");
 if(!last)$("status").textContent=t("wait")}
$("sheet").addEventListener("click",e=>{const s=e.target.closest("[data-s]"),v=e.target.closest("[data-v]");
 if(s){styleId=s.dataset.s;try{localStorage.setItem("eid-style",styleId)}catch(err){}setBase()}
 if(v){viewMode=+v.dataset.v}renderUI()});
$("bSet").onclick=()=>{$("sheet").hidden=!$("sheet").hidden};
$("bLang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("eid-lang",lang)}catch(e){}renderUI();theme()};
$("go").onclick=async()=>{$("start").hidden=true;
 try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}
 if(!navigator.geolocation){$("status").textContent=t("noGeo");return}
 navigator.geolocation.watchPosition(onPos,()=>{$("status").textContent=t("noGeo")},{enableHighAccuracy:true,maximumAge:0,timeout:15000})};
renderUI();
})();
</script>
</body>
</html>
