<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Eidmaps</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{--hud:rgba(14,16,22,.88);--ink:#f4f6f8;--muted:#a9b3bf;--line:rgba(255,255,255,.14);--accent:#35d0ff;--bad:#e5533d;
 --f:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;--m:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:#0b0d12;color:var(--ink);font-family:var(--f);overflow:hidden}
#map{position:fixed;inset:0}
.hud{position:fixed;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.turn{position:absolute;top:calc(10px + env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));background:var(--hud);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.turn .row{display:flex;gap:12px;align-items:center;padding:10px 14px}
.turn .row>svg{width:46px;height:46px;flex:none}
.turn .tx{min-width:0;flex:1}
.dist{font-family:var(--m);font-weight:600;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.dist small{font-size:13px;color:var(--muted);margin-inline-start:3px}
#instr{font-size:16px;font-weight:600;line-height:1.3}
#road{font-size:12px;color:var(--muted)}
.rad{padding:6px 14px;border-top:1px solid var(--line);font-size:12.5px;color:#f0c46a}
.rad b{font-family:var(--m);color:var(--ink)}
.rad.over,.rad.over b{color:#ff6b5a}
.lanes{direction:ltr;position:absolute;top:calc(118px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--hud);border-radius:12px;padding:5px 7px;display:flex;gap:2px}
.lanes span{width:30px;height:36px;display:grid;place-items:center;border-radius:7px;color:rgba(255,255,255,.35)}
.lanes span.on{background:var(--accent);color:#06222e}
.lanes svg{width:20px;height:24px}
.speeds{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom));inset-inline-start:max(12px,env(safe-area-inset-left));display:flex;gap:8px;align-items:center}
.spd{width:62px;height:62px;border-radius:50%;background:var(--hud);border:2px solid var(--line);display:grid;place-items:center;text-align:center}
.spd b{font-family:var(--m);font-size:22px;line-height:1}
.spd small{display:block;font-size:9.5px;color:var(--muted)}
.spd.over{border-color:var(--bad)}
.lim{width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid var(--bad);color:#111;display:grid;place-items:center;font-family:var(--m);font-weight:600;font-size:15px}
.lim.unk{opacity:.4}
.limsrc{font-size:10px;color:var(--muted);max-width:90px;line-height:1.3}
.recenter{position:absolute;bottom:calc(160px + env(safe-area-inset-bottom));inset-inline-end:max(12px,env(safe-area-inset-right));background:var(--accent);color:#06222e;border:0;border-radius:999px;height:44px;padding:0 18px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.loading,.est{position:absolute;left:50%;transform:translateX(-50%);background:var(--hud);border-radius:999px;padding:4px 12px;font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.loading{bottom:calc(152px + env(safe-area-inset-bottom))}
.est{bottom:calc(126px + env(safe-area-inset-bottom));background:transparent;padding:0;text-shadow:0 1px 3px #000}
.est:empty{display:none}
.bar{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));background:var(--hud);border:1px solid var(--line);border-radius:18px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.bar .eta{flex:1;min-width:0}
.bar .eta b{font-family:var(--m);font-size:16px;font-variant-numeric:tabular-nums;display:block}
.bar .eta span{font-size:12px;color:var(--muted)}
.ib{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center;padding:0}
.endnav{height:44px;border-radius:12px;background:var(--bad);border:0;padding:0 14px;font-weight:700}
.sheet{position:absolute;bottom:calc(74px + env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));max-width:460px;margin-inline:auto;max-height:66vh;overflow-y:auto;background:rgba(14,16,22,.97);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.sheet .hd{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:0;font-size:16px}
.lab{font-size:11.5px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 30%;min-width:0;background:rgba(255,255,255,.06);border:0;color:var(--muted);border-radius:9px;height:36px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);color:#06222e;font-weight:700}
.seg .sw{flex:0 0 34px;height:34px;border-radius:50%}
.seg .sw[aria-pressed=true]{outline:2px solid #fff;outline-offset:2px}
input[type=text],input[type=search]{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink);border-radius:12px;height:44px;padding:0 12px;font:inherit;font-size:15px;width:100%;box-sizing:border-box}
.res{display:block;width:100%;text-align:start;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.res b{display:block;font-size:14.5px}
.res span{font-size:12px;color:var(--muted)}
.res.route b{font-family:var(--m)}
.empty{font-size:13px;color:var(--muted);padding:8px}
.puck{width:30px;height:30px}
.camdot{width:22px;height:22px;border-radius:50%;background:#1b1d22;border:2px solid #f0b43c;display:grid;place-items:center;color:#f0b43c}
.start{position:fixed;inset:0;display:grid;place-items:center;background:#0b0d12;padding:24px;text-align:center;z-index:5}
.start h1{font-size:30px;margin:0 0 8px}
.start p{color:var(--muted);max-width:340px;margin:0 auto 18px;line-height:1.6}
.start button{background:var(--accent);color:#06222e;border:0;border-radius:14px;height:52px;padding:0 30px;font-size:17px;font-weight:700}
.start small{display:block;margin-top:16px;color:var(--muted);font-size:12px;max-width:320px}
.errbox{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:99;background:#fff;color:#a00;font:13px system-ui;padding:10px 12px;border-radius:10px;direction:ltr}
.maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="hud">
  <div class="turn">
    <div class="row"><svg id="turnIcon" viewBox="0 0 52 52" aria-hidden="true"></svg>
      <div class="tx"><div class="dist" id="dist"></div><div id="instr">—</div><div id="road"></div></div></div>
    <div class="rad" id="rad" hidden></div>
  </div>
  <div class="lanes" id="lanes" hidden aria-label="Lanes"></div>
  <div class="speeds"><div class="spd" id="spdBox"><div><b id="spd">0</b><small>km/h GPS</small></div></div><div class="lim unk" id="lim">—</div><div class="limsrc" id="limSrc"></div></div>
  <div class="loading" id="loading" hidden></div>
  <div class="est" id="estNote"></div>
  <button class="recenter" id="recenter" hidden></button>
  <div class="sheet" id="searchSheet" hidden>
    <div class="hd"><h2 id="searchTitle"></h2><button class="ib" id="closeSearch" aria-label="Close">✕</button></div>
    <input type="search" id="q" autocomplete="off">
    <div id="results" style="display:grid;gap:6px"></div>
  </div>
  <div class="sheet" id="settings" hidden>
    <div class="lab" id="l-view"></div><div class="seg" id="s-view"></div>
    <div class="lab" id="l-base"></div><div class="seg" id="s-base"></div>
    <div class="lab" id="l-theme"></div><div class="seg" id="s-theme"></div>
    <div class="lab" id="l-car"></div><input type="text" id="model" maxlength="40"><div class="seg" id="s-body"></div><div class="seg" id="s-color"></div>
    <label class="lab"><span id="l-glb"></span><br><input type="file" id="glb" accept=".glb,.gltf"></label>
    <div class="lab" id="l-voice"></div><div class="seg" id="s-voice"></div>
    <button class="res" id="bLang" style="text-align:center"></button>
  </div>
  <div class="bar">
    <div class="eta"><b id="eta"></b><span id="etaSub"></span></div>
    <button class="endnav" id="endNav" hidden></button>
    <button class="ib" id="bSearch"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="ib" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</div>
<div class="start" id="start"><div><h1>Eidmaps</h1><p id="startTxt"></p><button id="go"></button><small id="safe"></small></div></div>
<div class="errbox" id="errbox" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="js/geo.js?v=9"></script>
<script src="js/world3d.js?v=9"></script>
<script src="js/app.js?v=9"></script>
</body>
</html>
